name: CI - Build and Test

on:
  pull_request:
#    branches: ["main"]
    branches-ignore:
      - main
  push:
#    branches: ["main"]
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew bootJar -x test

      - name: Check build artifact
        run: |
          ls -al build/libs
          JAR_COUNT=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*plain*" | wc -l)
          test "$JAR_COUNT" -eq 1

          JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*plain*" | head -n 1)
          test -f "$JAR"
          echo "Built JAR: $JAR"