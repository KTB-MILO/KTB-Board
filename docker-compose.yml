services:
  mysql:
    image: mysql:8.4
    container_name: ktb-board-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: board
      MYSQL_USER: board
      MYSQL_PASSWORD: board1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "board", "-pboard1234"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
